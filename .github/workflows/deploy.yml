name: CI/CD Pipeline - Hostel Ghar Frontend (Netlify)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip lint & tests for emergency deployment'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Run code linter
        if: ${{ !inputs.skip_tests }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !inputs.skip_tests }}
        run: npm test

      - name: Build Next.js application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.hostelghar.com/api/v1/hostel-ghar' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://hostelghar.com' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://hostelghar.com' }}
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Verifying Next.js build output..."
          if [ ! -d ".next" ]; then
            echo "::error::Next.js .next directory was not generated."
            exit 1
          fi
          echo "✅ .next build directory verified successfully."

  deploy:
    name: Deploy to Netlify Production
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Netlify
        id: netlify-deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.hostelghar.com/api/v1/hostel-ghar' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://hostelghar.com' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://hostelghar.com' }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "🚀 Deploying to Netlify using Netlify CLI with repository secrets..."
            npx netlify-cli deploy \
              --prod \
              --build \
              --auth "$NETLIFY_AUTH_TOKEN" \
              --site "$NETLIFY_SITE_ID" \
              --message "Deploy commit ${{ github.sha }} via GitHub Actions"
            echo "✅ Successfully deployed to Netlify production via Netlify CLI."
          elif [ -n "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "🔗 Triggering Netlify build via incoming webhook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL")
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
              echo "✅ Netlify build hook triggered successfully (HTTP $HTTP_STATUS)."
            else
              echo "::warning::Netlify build hook returned status $HTTP_STATUS."
            fi
          else
            echo "ℹ️ Neither NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID nor NETLIFY_BUILD_HOOK_URL secrets were detected."
            echo "ℹ️ If your repository is connected directly to Netlify (Netlify GitHub App), Netlify deploys automatically on every push to main."
            echo "ℹ️ To deploy directly from GitHub Actions, add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in GitHub -> Settings -> Secrets and variables -> Actions."
          fi

      - name: Production Health Check
        env:
          TARGET_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://hostelghar.com' }}
        run: |
          echo "Starting health check on $TARGET_URL..."
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=6
          SUCCESS=0

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" -L "$TARGET_URL" || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP response code $STATUS"

            if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ Health check passed! Site is live (HTTP $STATUS)."
              SUCCESS=1
              break
            fi
            sleep $SLEEP_SECONDS
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::warning::Site $TARGET_URL did not respond with 200 within timeout. Deployment might still be propagating on Netlify CDN."
          fi
